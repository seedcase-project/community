project:
  type: seedcase-theme

website:
  title: "Seedcase Project: Community"
  site-url: "https://community.seedcase-project.org/"
  repo-url: "https://github.com/seedcase-project/community"
  page-navigation: true
  navbar:
    title: false
    logo: _extensions/seedcase-project/seedcase-theme/logos/docs/navbar-community.svg
    logo-alt: "Seedcase Community logo: Main page"
    pinned: true
    left:
      - posts/index.qmd
      - learn/index.qmd
    right:
      - text: "<img src='/_extensions/seedcase-project/seedcase-theme/logos/seedcase/a-part-of.svg' alt='Main Seedcase website' height='30px'>"
        href: "https://seedcase-project.org"
    tools:
      - icon: github
        href: "https://github.com/seedcase-project/community"
        aria-label: "GitHub icon: Source repository"
  sidebar:
    - id: guides
      pinned: true
      style: "floating"
      contents:
        - auto: guides

format:
  seedcase-theme-html:
    include-before-body:
      - "includes/site-counter.html"

execute:
  echo: false
